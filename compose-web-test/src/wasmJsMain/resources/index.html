<!DOCTYPE html>
<html lang="ko">
<head>
    <base href="/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Kakao JavaScript SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"></script>

    <!-- Naver Login SDK -->
    <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js"></script>

    <title>온라인 스탬프 투어</title>

    <style>
        html,
 body {
     width: 100%;
     height: 100%;
     margin: 0;
     padding: 0;
 }

 body {
     overflow: hidden;
 }

 #compose-root {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100dvh;
    min-height: 0;
    max-height: 100dvh;
    overflow: hidden;
 }
    </style>
</head>

<body>

<div id="compose-root"></div>

<div id="kakao-map-root"></div>

<!-- Kakao Map SDK -->
<script
        type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4111465b47e58d1d8b00eb3992296fc1">
</script>

<script src="/kakao-map.js"></script>

<script src="/ComposeWebTest.js"></script>

<script>
    /*
     * ========================================
     * 소셜 로그인 설정
     * ========================================
     */

    const SOCIAL_CONFIG = {
        kakaoJavaScriptKey: "4111465b47e58d1d8b00eb3992296fc1",
        naverClientId: "0YLBJJdHMRJ44evdP6rN"
    };


    /*
     * ========================================
     * 공통 소셜 로그인 데이터
     * ========================================
     */

    window.socialLoginSuccess = function (provider, token) {
        console.log("[Social] 로그인 토큰 수신:", provider);

        if (!provider || !token) {
            console.error("[Social] provider 또는 token이 없습니다.");
            return;
        }

        localStorage.setItem(
            "social_login_provider",
            provider
        );

        localStorage.setItem(
            "social_login_token",
            token
        );

        window.dispatchEvent(
            new CustomEvent("social-login-success")
        );
    };


    window.clearSocialLoginData = function () {
        localStorage.removeItem("social_login_provider");
        localStorage.removeItem("social_login_token");
    };


    window.getSocialLoginProvider = function () {
        return localStorage.getItem(
            "social_login_provider"
        );
    };


    window.getSocialLoginToken = function () {
        return localStorage.getItem(
            "social_login_token"
        );
    };


    /*
     * ========================================
     * Kakao Login
     * ========================================
     */

    window.initKakaoLogin = function () {
        if (typeof Kakao === "undefined") {
            console.error(
                "[Social] Kakao SDK가 로드되지 않았습니다."
            );
            return false;
        }

        if (!SOCIAL_CONFIG.kakaoJavaScriptKey) {
            console.error(
                "[Social] Kakao JavaScript Key가 없습니다."
            );
            return false;
        }

        try {
            if (!Kakao.isInitialized()) {
                Kakao.init(
                    SOCIAL_CONFIG.kakaoJavaScriptKey
                );
            }

            console.log(
                "[Social] Kakao 초기화:",
                Kakao.isInitialized()
            );

            return Kakao.isInitialized();

        } catch (error) {
            console.error(
                "[Social] Kakao 초기화 실패",
                error
            );

            return false;
        }
    };


window.loginWithKakao = function () {
    if (!window.initKakaoLogin()) return;

    try {
        console.log("[Social] Kakao 로그인 시작");

        Kakao.Auth.login({
            success: function (authObj) {
                console.log("[Social] Kakao 로그인 성공");
                console.log("[Social] Kakao accessToken 획득");

                window.socialLoginSuccess(
                    "kakao",
                    authObj.access_token
                );
            },
            fail: function (error) {
                console.error(
                    "[Social] Kakao 로그인 실패",
                    error
                );
            }
        });
    } catch (error) {
        console.error(
            "[Social] Kakao 로그인 시작 실패",
            error
        );
    }
};


    /*
     * Kakao authorization code 읽기
     */
    window.getKakaoAuthorizationCode = function () {
        const params =
            new URLSearchParams(
                window.location.search
            );

        const code = params.get("code");

        if (!code) {
            return null;
        }

        console.log(
            "[Social] Kakao authorization code 수신"
        );

        return code;
    };


    /*
     * Kakao authorization code를
     * 읽은 뒤 URL에서 제거
     *
     * 중요:
     * 같은 code를 여러 번 서버로 보내는 것을
     * 방지합니다.
     */
    window.consumeKakaoAuthorizationCode = function () {
        const params =
            new URLSearchParams(
                window.location.search
            );

        const code = params.get("code");

        if (!code) {
            return null;
        }

        console.log(
            "[Social] Kakao authorization code 소비"
        );

        params.delete("code");
        params.delete("error");
        params.delete("error_description");

        const queryString =
            params.toString();

        const newUrl =
            window.location.pathname +
            (queryString
                ? "?" + queryString
                : "") +
            window.location.hash;

        window.history.replaceState(
            {},
            document.title,
            newUrl
        );

        return code;
    };


    window.getKakaoError = function () {
        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("error");
    };


    window.getKakaoErrorDescription = function () {
        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get(
            "error_description"
        );
    };


    /*
     * ========================================
     * Naver Login
     * ========================================
     */

    window.loginWithNaver = function () {
        if (typeof naver === "undefined") {
            console.error(
                "[Social] Naver SDK가 로드되지 않았습니다."
            );
            return;
        }

        if (!SOCIAL_CONFIG.naverClientId) {
            console.error(
                "[Social] Naver Client ID가 없습니다."
            );
            return;
        }

        try {
            const callbackUrl =
                window.location.origin +
                window.location.pathname;

            console.log(
                "[Social] Naver 로그인 시작"
            );

            console.log(
                "[Social] Naver callbackUrl:",
                callbackUrl
            );

            /*
             * loginButton을 사용하지 않습니다.
             *
             * Compose에서 이미 자체적으로
             * 네이버 로그인 버튼을 만들고 있기 때문에
             * Naver SDK가 DOM 버튼을 생성하도록 하면
             *
             * createButtonElement
             * null.firstChild
             *
             * 오류가 발생합니다.
             */
            const naverLogin =
                new naver.LoginWithNaverId({
                    clientId:
                        SOCIAL_CONFIG.naverClientId,

                    callbackUrl:
                        callbackUrl,

                    isPopup: false
                });

            naverLogin.init();

            /*
             * 네이버 로그인 페이지로 이동
             */
            naverLogin.authorize();

        } catch (error) {
            console.error(
                "[Social] Naver 로그인 시작 실패",
                error
            );
        }
    };


    /*
     * ========================================
     * Naver callback 처리
     * ========================================
     *
     * 네이버 로그인 후 callback URL로 돌아왔을 때
     * 현재 URL에 access_token 등이 포함될 수 있으므로
     * SDK에서 로그인 상태를 확인합니다.
     */

    window.checkNaverLoginCallback = function () {
        if (typeof naver === "undefined") {
            return null;
        }

        try {
            const naverLogin =
                new naver.LoginWithNaverId({
                    clientId:
                        SOCIAL_CONFIG.naverClientId,

                    callbackUrl:
                        window.location.origin +
                        window.location.pathname,

                    isPopup: false
                });

            naverLogin.init();

            naverLogin.getLoginStatus(
                function (status) {
                    if (!status) {
                        console.error(
                            "[Social] Naver 로그인 상태 확인 실패"
                        );
                        return;
                    }

                    const accessToken =
                        naverLogin.getAccessToken();

                    if (!accessToken) {
                        console.error(
                            "[Social] Naver accessToken 없음"
                        );
                        return;
                    }

                    console.log(
                        "[Social] Naver 로그인 성공"
                    );

                    window.socialLoginSuccess(
                        "naver",
                        accessToken
                    );
                }
            );

        } catch (error) {
            console.error(
                "[Social] Naver callback 처리 실패",
                error
            );
        }
    };


    /*
     * ========================================
     * Social Login Callback 확인
     * ========================================
     */

    window.checkSocialLoginCallback = function () {

        /*
         * ----------------------------------------
         * Kakao
         * ----------------------------------------
         */

        const kakaoCode =
            window.getKakaoAuthorizationCode();

        if (kakaoCode) {
            console.log(
                "[Social] Kakao callback code 확인"
            );

            return {
                provider: "kakao",
                code: kakaoCode
            };
        }


        /*
         * Kakao 로그인 실패
         */

        const kakaoError =
            window.getKakaoError();

        if (kakaoError) {
            console.error(
                "[Social] Kakao 로그인 실패:",
                kakaoError
            );

            const description =
                window.getKakaoErrorDescription();

            if (description) {
                console.error(
                    "[Social] Kakao 오류 설명:",
                    description
                );
            }
        }


        return null;
    };


    /*
     * ========================================
     * 페이지 로드
     * ========================================
     */

    window.addEventListener(
        "load",
        function () {
            console.log(
                "[Social] Social Login 초기화 완료"
            );

            const callback =
                window.checkSocialLoginCallback();

            if (callback) {
                console.log(
                    "[Social] callback provider:",
                    callback.provider
                );
            }
        }
    );

</script>

</body>
</html>
